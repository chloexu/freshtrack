<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FreshTrack — UI Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a18; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  return (
    <DesignCanvas title="FreshTrack — UI Redesign">
      <DCSection id="screens" title="Core Screens">
        <DCArtboard id="s1" label="01 · Add Groceries" width={390} height={844}>
          <IOSDevice width={390} height={844} statusBarStyle="dark">
            <AddGroceriesScreen />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard id="s2" label="02 · My Fridge" width={390} height={844}>
          <IOSDevice width={390} height={844} statusBarStyle="dark">
            <FridgeHomeScreen />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard id="s3" label="03 · Reminders" width={390} height={844}>
          <IOSDevice width={390} height={844} statusBarStyle="dark">
            <RemindersScreen />
          </IOSDevice>
        </DCArtboard>
      </DCSection>
      <DCSection id="states" title="Item States & Components">
        <DCArtboard id="c1" label="Urgency Indicators" width={390} height={320}>
          <UrgencyStates />
        </DCArtboard>
        <DCArtboard id="c2" label="Item Row — Expanded" width={390} height={260}>
          <ItemRowExpanded />
        </DCArtboard>
        <DCArtboard id="c3" label="Reminder Card" width={390} height={280}>
          <ReminderCardDetail />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<div id="root"></div>
</body>
</html>
